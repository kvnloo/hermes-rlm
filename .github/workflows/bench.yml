name: bench

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bench dependencies
        run: python -m pip install -r bench/requirements.txt
      - name: Bench tests (required deps enforced)
        env:
          BENCH_REQUIRE_DEPS: '1'
        run: python -m unittest discover -s bench
      - name: Repo tests
        run: python -m unittest discover -s tests
